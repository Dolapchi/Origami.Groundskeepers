<!DOCTYPE html>
<html lang="ru" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <link rel="manifest" href="./manifest.json">
    <title>Origami | Groundskeepers™</title>
    <style>
        :root {
            --bg-main: #020804;
            --neon-green: #00ff66;
            --neon-glow: rgba(0, 255, 102, 0.3);
            --panel-bg: rgba(0, 20, 8, 0.6);
            --border-color: rgba(0, 255, 102, 0.2);
            --text-main: #e0ffeb;
            --text-muted: rgba(0, 255, 102, 0.5);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 255, 102, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(0, 255, 102, 0.15) 0%, transparent 50%),
                linear-gradient(rgba(0, 255, 102, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 102, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 20px 20px, 20px 20px;
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .calculator-card {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 430px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(0, 255, 102, 0.05);
            position: relative;
        }
        .calculator-card::before, .calculator-card::after {
            content: ''; position: absolute; width: 12px; height: 12px; border-color: var(--neon-green); border-style: solid;
        }
        .calculator-card::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
        .calculator-card::after { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }
        .header {
            text-align: left;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
            color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-glow);
        }
        .header h1 span {
            font-size: 10px;
            vertical-align: super;
            margin-left: 2px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input[type="number"] {
            width: 100%;
            background: rgba(0, 10, 4, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px 14px;
            color: var(--neon-green);
            font-size: 16px;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
        }
        input[type="number"]:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-glow), inset 0 0 5px rgba(0, 255, 102, 0.2);
        }
        .helper-text {
            font-size: 10px;
            color: rgba(0, 255, 102, 0.3);
            margin-top: 5px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            position: relative;
            padding: 8px 0;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }
        .checkmark {
            height: 18px;
            width: 18px;
            background: rgba(0, 10, 4, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .checkbox-container input:checked ~ .checkmark {
            background: rgba(0, 255, 102, 0.2);
            border-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-glow);
        }
        .checkmark:after {
            content: "";
            display: none;
            width: 4px;
            height: 8px;
            border: solid var(--neon-green);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }
        .checkbox-container input:checked ~ .checkmark:after {
            display: block;
        }
        .checkbox-label {
            font-size: 12px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn-calc {
            background: transparent;
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }
        .btn-calc:hover {
            background: var(--neon-green);
            color: #000000;
            box-shadow: 0 0 15px var(--neon-glow);
        }
        .btn-clear {
            background: transparent;
            color: #ff3b3b;
            border: 1px solid rgba(255, 59, 59, 0.4);
        }
        .btn-clear:hover {
            background: rgba(255, 59, 59, 0.1);
            border-color: #ff3b3b;
        }
        .result-box {
            background: rgba(0, 30, 12, 0.8);
            border: 1px solid var(--neon-green);
            border-radius: 8px;
            padding: 18px;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.1);
        }
        .result-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .result-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-glow);
        }
        .result-stats {
            font-size: 11px;
            color: rgba(0, 255, 102, 0.4);
            margin-top: 6px;
        }
    </style>
</head>
<body class="notranslate" translate="no">
<div class="calculator-card">
    <div class="header">
        <h1>Origami | Groundskeepers<span>™</span></h1>
    </div>
    <div class="form-group">
        <label>Стоимость, м²/руб.</label>
        <input type="number" id="price" placeholder="0.00" min="0" step="0.01">
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>Длина поля, м</label>
            <input type="number" id="length" placeholder="0" min="0">
        </div>
        <div class="form-group">
            <label>Ширина поля, м</label>
            <input type="number" id="width" placeholder="0" min="0">
        </div>
    </div>
    <div class="form-group">
        <label>Количество соток</label>
        <input type="number" id="sotki" placeholder="0" min="0" step="0.1">
        <div class="helper-text" id="sotki-helper">> Заполняется, если известно количество соток</div>
    </div>
    <label class="checkbox-container">
        <input type="checkbox" id="complex">
        <span class="checkmark"></span>
        <span class="checkbox-label">> Сложный ландшафт (+25%)</span>
    </label>
    <label class="checkbox-container">
        <input type="checkbox" id="highGrass">
        <span class="checkmark"></span>
        <span class="checkbox-label">> Высота травы более 100 см (+75%)</span>
    </label>
    <div class="form-group" style="margin-top: 10px;">
        <label>Скидка, %</label>
        <input type="number" id="discount" placeholder="0" min="0" max="100">
    </div>
    <div class="btn-row">
        <button class="btn btn-clear" onclick="clearAll()">Очистить</button>
        <button class="btn btn-calc" onclick="calculate()">Расчет</button>
    </div>
    <div class="result-box">
        <div class="result-title">// Итоговая сумма //</div>
        <div class="result-value" id="total-sum">0.00 ₽</div>
        <div class="result-stats" id="area-stats">Общая площадь: 0 кв.м.</div>
    </div>
</div>
<script>
    const priceInput = document.getElementById('price');
    const lengthInput = document.getElementById('length');
    const widthInput = document.getElementById('width');
    const sotkiInput = document.getElementById('sotki');
    const complexCheck = document.getElementById('complex');
    const highGrassCheck = document.getElementById('highGrass');
    const discountInput = document.getElementById('discount');
    const totalSumEl = document.getElementById('total-sum');
    const areaStatsEl = document.getElementById('area-stats');

    function calculate() {
        const price = parseFloat(priceInput.value) || 0;
        const length = parseFloat(lengthInput.value) || 0;
        const width = parseFloat(widthInput.value) || 0;
        const sotki = parseFloat(sotkiInput.value) || 0;
        const discount = parseFloat(discountInput.value) || 0;
        let calculatedSqM = 0;
        if (length > 0 && width > 0) {
            calculatedSqM = length * width;
        } else if (sotki > 0) {
            calculatedSqM = sotki * 100;
        }
        if (price <= 0 || calculatedSqM <= 0) {
            totalSumEl.innerText = "0.00 ₽";
            areaStatsEl.innerText = `Общая площадь: ${calculatedSqM.toFixed(1)} кв.м.`;
            return;
        }
        const baseSum = calculatedSqM * price;
        let complexBonus = complexCheck.checked ? (baseSum * 0.25) : 0;
        let highGrassBonus = highGrassCheck.checked ? (baseSum * 0.75) : 0;
        let total = baseSum + complexBonus + highGrassBonus;
        if (discount > 0 && discount <= 100) {
            total *= (1 - discount / 100);
        }
        totalSumEl.innerText = `${total.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ₽`;
        areaStatsEl.innerText = `Общая площадь: ${calculatedSqM.toFixed(1)} кв.м. (${(calculatedSqM / 100).toFixed(2)} сот.)`;
    }

    function clearAll() {
        priceInput.value = ''; lengthInput.value = ''; widthInput.value = ''; sotkiInput.value = ''; discountInput.value = '';
        complexCheck.checked = false; highGrassCheck.checked = false;
        totalSumEl.innerText = "0.00 ₽"; areaStatsEl.innerText = "Общая площадь: 0 кв.м.";
    }

    // Регистрация PWA робота
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
    }
</script>
</body>
</html>
