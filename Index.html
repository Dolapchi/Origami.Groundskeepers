<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origami | Groundskeeper v.1.0</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #112214 0%, #070d08 100%);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-green: #4caf50;
            --accent-glow: rgba(76, 175, 80, 0.3);
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .calculator-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-left: 4px;
        }

        input[type="number"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: var(--accent-green);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        input:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: rgba(0, 0, 0, 0.2);
        }

        .helper-text {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 4px;
            padding-left: 4px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            position: relative;
            padding: 12px 4px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            height: 22px;
            width: 22px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .checkbox-container:hover input ~ .checkmark {
            background: rgba(255, 255, 255, 0.15);
        }

        .checkbox-container input:checked ~ .checkmark {
            background: var(--accent-green);
            border-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .checkmark:after {
            content: "";
            display: none;
            width: 5px;
            height: 10px;
            border: solid #000;
            border-width: 0 2.5px 2.5px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }

        .checkbox-container input:checked ~ .checkmark:after {
            display: block;
        }

        .checkbox-label {
            font-size: 14px;
            color: var(--text-main);
        }

        .result-box {
            background: rgba(76, 175, 80, 0.12);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-top: 24px;
            box-shadow: inset 0 0 15px rgba(76, 175, 80, 0.05);
        }

        .result-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }

        .result-stats {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <h1>Origami | Groundskeeper(r) v.1.0</h1>
    </div>

    <!-- Поле 0 -->
    <div class="form-group">
        <label for="price">Поле 0: Стоимость кв. метра (руб)</label>
        <input type="number" id="price" placeholder="0.00" min="0" step="0.01">
    </div>

    <!-- Поле 1 -->
    <div class="form-row">
        <div class="form-group">
            <label for="length">Длина поля (м)</label>
            <input type="number" id="length" placeholder="0" min="0">
        </div>
        <div class="form-group">
            <label for="width">Ширина поля (м)</label>
            <input type="number" id="width" placeholder="0" min="0">
        </div>
    </div>

    <!-- Поле 2 -->
    <div class="form-group">
        <label for="sotki">Поле 2: Количество соток</label>
        <input type="number" id="sotki" placeholder="0" min="0" step="0.1">
        <div class="helper-text" id="sotki-helper">Заполните, если Длина и Ширина пусты</div>
    </div>

    <!-- Поле 3 -->
    <label class="checkbox-container">
        <input type="checkbox" id="complex">
        <span class="checkmark"></span>
        <span class="checkbox-label">Поле 3: Сложный ландшафт (коэф. 1.25)</span>
    </label>

    <!-- Поле 4 -->
    <label class="checkbox-container">
        <input type="checkbox" id="highGrass">
        <span class="checkmark"></span>
        <span class="checkbox-label">Поле 4: Высота травы > 100 см (коэф. 1.75)</span>
    </label>

    <!-- Поле 5 -->
    <div class="form-group" style="margin-top: 8px;">
        <label for="discount">Поле 5: Скидка (%)</label>
        <input type="number" id="discount" placeholder="0" min="0" max="100">
    </div>

    <!-- Результат -->
    <div class="result-box">
        <div class="result-title">Итоговая сумма</div>
        <div class="result-value" id="total-sum">0.00 руб.</div>
        <div class="result-stats" id="area-stats">Общая площадь: 0 кв.м.</div>
    </div>
</div>

<script>
    const priceInput = document.getElementById('price');
    const lengthInput = document.getElementById('length');
    const widthInput = document.getElementById('width');
    const sotkiInput = document.getElementById('sotki');
    const complexCheck = document.getElementById('complex');
    const highGrassCheck = document.getElementById('highGrass');
    const discountInput = document.getElementById('discount');
    
    const totalSumEl = document.getElementById('total-sum');
    const areaStatsEl = document.getElementById('area-stats');
    const sotkiHelper = document.getElementById('sotki-helper');

    function calculate() {
        const price = parseFloat(priceInput.value) || 0;
        const length = parseFloat(lengthInput.value) || 0;
        const width = parseFloat(widthInput.value) || 0;
        let sotki = parseFloat(sotkiInput.value) || 0;
        const discount = parseFloat(discountInput.value) || 0;

        const isField1Active = length > 0 || width > 0;
        let calculatedSqM = 0;

        if (isField1Active) {
            sotkiInput.disabled = true;
            calculatedSqM = length * width;
            sotkiInput.value = (calculatedSqM / 100).toFixed(2);
            sotkiHelper.innerText = "Рассчитано автоматически из габаритов поля";
        } else {
            sotkiInput.disabled = false;
            calculatedSqM = sotki * 100;
            sotkiHelper.innerText = "Заполните, если Длина и Ширина пусты";
        }

        if (price <= 0 || calculatedSqM <= 0) {
            totalSumEl.innerText = "0.00 руб.";
            areaStatsEl.innerText = `Общая площадь: ${calculatedSqM.toFixed(1)} кв.м.`;
            return;
        }

        let currentPrice = price;
        if (complexCheck.checked) currentPrice *= 1.25;
        if (highGrassCheck.checked) currentPrice *= 1.75;

        let total = calculatedSqM * currentPrice;

        if (discount > 0 && discount <= 100) {
            total *= (1 - discount / 100);
        }

        totalSumEl.innerText = `${total.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2})} руб.`;
        areaStatsEl.innerText = `Общая площадь: ${calculatedSqM.toFixed(1)} кв.м. (${(calculatedSqM/100).toFixed(2)} сот.)`;
    }

    [priceInput, lengthInput, widthInput, sotkiInput, discountInput].forEach(input => {
        input.addEventListener('input', calculate);
    });
    [complexCheck, highGrassCheck].forEach(check => {check.addEventListener('change', calculate);});
